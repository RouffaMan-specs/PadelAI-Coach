
name: Build Padel AI Coach

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build iOS app
        run: |
          xcodebuild \
            -project PadelAICoach.xcodeproj \
            -scheme PadelAICoach \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PadelAICoach.app Payload/
          zip -r PadelAICoach-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PadelAICoach-unsigned-IPA
          path: PadelAICoach-unsigned.ipa
          retention-days: 7

