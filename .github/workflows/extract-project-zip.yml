name: Extract project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          rm -rf extracted/.github/workflows
          unzip -q PadelAICoach-GitHub-Free-Build.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract iOS project" || echo "Nothing to commit"
          git push
